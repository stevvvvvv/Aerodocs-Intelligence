# Déploie la démo sur un Hugging Face Space à chaque push sur main.
# Prérequis (une fois) : secret HF_TOKEN (token "write") et variable HF_SPACE (ex. "steven-jansen/aerodocs-intelligence")
# dans Settings > Secrets and variables > Actions du dépôt GitHub.
name: deploy-space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler le Space
        run: |
          mkdir -p /tmp/space
          rsync -a --exclude .git --exclude node_modules --exclude 'docs/screenshots' ./ /tmp/space/
          cp deploy/Dockerfile.space /tmp/space/Dockerfile
          cp deploy/space_readme.md /tmp/space/README.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publier sur Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_SPACE"]
          api.create_repo(repo, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(folder_path="/tmp/space", repo_id=repo, repo_type="space",
                            commit_message=f"Déploiement {os.environ.get('GITHUB_SHA', '')[:7]}",
                            delete_patterns=["*"])
          PY
